version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsmemory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmemory_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsmemory}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmemory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://opsmemory:opsmemory_password@postgres:5432/opsmemory
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL:-https://api.hindsight.vectorize.io}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-opsmemory-demo}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-opsmemory-github-webhook-secret}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-opsmemory-gitlab-webhook-secret}
      - JWT_SECRET=${JWT_SECRET:-opsmemory-dev-secret-key-change-in-production-32bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - opsmemory_data:/app/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.main
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://opsmemory:opsmemory_password@postgres:5432/opsmemory
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-opsmemory-demo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  opsmemory_data:
